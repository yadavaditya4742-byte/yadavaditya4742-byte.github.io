<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="impact-site-verification" value="c7fe28fa-50b2-4c2b-9732-10f0f274ecdc" />
  <title>Prepline: budget meal planner</title>
  <meta name="description" content="Prepline plans high-protein dinners under your weekly budget, priced at your store, with one grocery list that adds up." />
  <meta name="theme-color" content="#12301f" />
  <link rel="icon" type="image/svg+xml" href="/Prepline/favicon.svg" />
  <meta http-equiv="refresh" content="2; url=/Prepline/" />
  <style>
    :root { --bg: #f4f3ee; --ink: #12301f; --lime: #d6f35f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c1711; --ink: #eef3ea; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 34px; letter-spacing: -0.03em; margin: 18px 0 6px; }
    p { margin: 0 0 22px; opacity: 0.8; }
    a.btn { display: inline-block; background: var(--lime); color: #12301f; text-decoration: none; font-weight: 800;
      padding: 14px 26px; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <img src="/Prepline/icons/icon-192.png" alt="" />
    <h1>Prepline</h1>
    <p>High-protein dinners for the week, priced at your store.</p>
    <a class="btn" href="/Prepline/">Open Prepline</a>
  </main>
</body>
</html>
